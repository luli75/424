<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explora Libertador - Propuesta Minimalista</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #06090e;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Iluminación ambiental de fondo adaptable */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Barra superior fluida y responsive */
        header {
            width: 100%;
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (min-width: 768px) {
            header {
                padding: 30px 40px;
            }
        }

        /* Logo LSM sólido */
        .logo-lsm {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #3b82f6;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
            user-select: none;
        }

        @media (min-width: 768px) {
            .logo-lsm {
                font-size: 1.8rem;
            }
        }

        .instagram-link {
            color: #475569;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
        }

        .instagram-link:hover {
            color: #3b82f6;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.8));
        }

        /* Contenedor principal centrado con ajuste responsive */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            text-align: center;
            transform: translateY(-20px);
        }

        @media (min-width: 768px) {
            main {
                transform: translateY(-60px);
            }
        }

        /* Título con tamaño fluido para pantallas móviles y PC */
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
            margin-bottom: 14px;
            line-height: 1.2;
        }

        h1 span {
            color: #3b82f6;
            text-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 3.2rem;
                letter-spacing: -1.5px;
                line-height: 1.1;
                margin-bottom: 16px;
            }
        }

        .description {
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.5;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        @media (min-width: 768px) {
            .description {
                font-size: 1.05rem;
                line-height: 1.6;
                margin-bottom: 35px;
            }
        }

        /* Buscador responsive al ancho de pantalla */
        .search-container {
            width: 100%;
            max-width: 520px;
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            background: #0f141c;
            border: 1px solid #1e293b;
            padding: 12px 16px;
            padding-left: 42px;
            border-radius: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        @media (min-width: 768px) {
            .search-input {
                padding: 14px 20px;
                padding-left: 44px;
                font-size: 0.95rem;
            }
        }

        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #111823;
            box-shadow: 0 0 0 1px #3b82f6, 0 4px 24px rgba(59, 130, 246, 0.15);
        }

        .search-input::placeholder {
            color: #475569;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            fill: #475569;
            pointer-events: none;
            transition: fill 0.2s ease;
        }

        @media (min-width: 768px) {
            .search-icon {
                left: 16px;
            }
        }
